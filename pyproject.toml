[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccb-assistant"
# The version lives in ccb/__init__.py and is read from there: a release number typed in
# two places is a release number that eventually disagrees with itself.
dynamic = ["version"]
description = "Three modules over one shared floor: source-agnostic paper search and download, a durable local paper library, and research-topic mining over that corpus. Built for AI harnesses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No required third-party dependencies, by design: urllib/json/sqlite3/hashlib/csv only,
# so the tool drops into any harness without a dependency-resolution step.
dependencies = []

[project.optional-dependencies]
# Extraction engines, in preference order. The tool works without them and says so.
pdf = ["pdfplumber>=0.11", "pypdf>=4.0"]
# Only needed for YAML channel declaration files.
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.17"]

[project.scripts]
ccb = "ccb.cli:main"
ccb-mcp = "ccb.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "ccb.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# The default set: pyflakes plus the pycodestyle *errors*. High signal (unused imports,
# undefined names, real mistakes), no style debates — the codebase already has a style.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

# The CCF catalogue is data, not code: it ships as a CSV so it can be replaced without
# touching Python. Set CCB_CCF_CATALOG to point at your own copy.
[tool.setuptools.package-data]
"ccb.topics" = ["data/*.csv"]
