name: CI

# The suite is hermetic — no network, no third-party dependencies — so CI costs almost
# nothing and is what makes the boundary tests worth having: a DAG violation or a
# contract naming a flag that does not exist fails here, on someone else's machine,
# before it fails in a session.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check src tests

      - name: Test
        run: python -m unittest discover -s tests -v
