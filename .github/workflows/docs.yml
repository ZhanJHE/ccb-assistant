name: Docs

# Build the documentation site from `开发文档/` and publish it to GitHub Pages.
#
# `mkdocs build --strict` treats warnings as errors, so a dead internal link fails the
# build rather than reaching a reader. Deployment needs Pages switched on first
# (Settings → Pages → Source: GitHub Actions); until then the `deploy` job fails and the
# `build` job still reports whether the site itself is sound.

on:
  push:
    branches: [main]
    paths:
      - '开发文档/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '开发文档/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the docs toolchain
        run: python -m pip install -r requirements-docs.txt

      - name: Build (warnings are errors)
        run: mkdocs build --strict

      - name: Package the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
